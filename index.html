<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QR Code Generator</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="container">
      <h1>QR Code Generator</h1>

      <p>Enter your text or URL below</p>

      <input type="text" placeholder="Enter Text or URL..." id="qrText" />

      <div id="imgBox">
        <img src="" id="qrImage" alt="QR Code Preview" />
      </div>

      <div class="error-msg">
        <small>Field cannot be empty</small>
      </div>
    <div class="history-section">
  <h3 class="history-title">History</h3>

  <div id="historyContainer" class="history-container"></div>
</div>
      <button id="btn">Generate QR Code</button>
      <button id="downloadBtn">Download QR</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
